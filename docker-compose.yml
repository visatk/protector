services:
  aegistg:
    build: .
    container_name: aegistg-protector
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - aegistg_data:/app/data
      - ./config/default_policy.yaml:/app/config/default_policy.yaml:ro
    # Uncomment for webhook mode:
    # command: ["python3", "-m", "protector", "webhook"]
    # ports:
    #   - "8443:8443"

  # Optional: Self-hosted Telegram Local Bot API Server for >20MB media scanning & ultra-low latency
  # Uncomment and set TELEGRAM_API_ID, TELEGRAM_API_HASH, and TELEGRAM_API_BASE_URL=http://telegram-bot-api:8081
  # telegram-bot-api:
  #   image: aiogram/telegram-bot-api:latest
  #   container_name: telegram-local-bot-api
  #   restart: unless-stopped
  #   environment:
  #     TELEGRAM_API_ID: "${TELEGRAM_API_ID}"
  #     TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"
  #     TELEGRAM_LOCAL: "1"
  #   volumes:
  #     - tg_bot_api_data:/var/lib/telegram-bot-api

volumes:
  aegistg_data:
  # tg_bot_api_data:
